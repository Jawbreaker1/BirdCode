[package]
name = "birdcode-protocol"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
url = "2.5.8"

[dev-dependencies]
jsonschema = { version = "0.48.0", default-features = false }

[build-dependencies]
quote = "1.0.41"
serde_json = "1.0.145"
syn = { version = "2.0.106", features = ["full", "parsing"] }
