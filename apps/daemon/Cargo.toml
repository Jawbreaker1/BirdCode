[package]
name = "birdcode-daemon"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
birdcode-backends = { path = "../../crates/backends" }
birdcode-orchestrator = { path = "../../crates/orchestrator" }
birdcode-prompting = { path = "../../crates/prompting" }
birdcode-protocol = { path = "../../crates/protocol" }
birdcode-runtime = { path = "../../crates/runtime" }
birdcode-store = { path = "../../crates/store" }
birdcode-tooling = { path = "../../crates/tooling" }
birdcode-workspace = { path = "../../crates/workspace" }
chrono = "0.4.42"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
jsonschema = { version = "0.48.0", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.27.0"

[lints]
workspace = true
